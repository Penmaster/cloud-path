    {s:3,w:9,t:"REVIEW — free labs",min:120,goal:"Repetition on real AWS.",r:["workshops","workshops2"],do:"Pick one beginner (level 100) AWS workshop and complete it end to end. Delete everything afterwards.",dn:"Workshop finished, resources deleted, bill checked."},

    {s:3,w:10,t:"EC2 — virtual servers",min:120,goal:"The same server skills, now in AWS.",r:["awsdocs","workshops"],do:"Launch an EC2 instance, configure a security group, connect via SSM Session Manager (not SSH keys). Install nginx via user-data.",dn:"An instance that serves a page the moment it boots, with no manual steps."},
    {s:3,w:10,t:"Storage — EBS and AMIs",min:90,goal:"Where the data actually lives.",r:["awsdocs"],do:"Attach an extra EBS volume, format and mount it. Take a snapshot. Create a custom AMI from your instance.",dn:"You launched a new instance from your own AMI."},
    {s:3,w:10,t:"S3 — object storage",min:90,goal:"The most used AWS service, and the most misconfigured.",r:["awsdocs","workshops"],do:"Create a bucket, block public access, upload files, host a static site, set a lifecycle rule. Read about famous S3 leaks.",dn:"A static site served from S3, and you can explain bucket policy vs IAM policy."},
    {s:3,w:10,t:"CloudWatch — seeing what's happening",min:90,goal:"You can't fix what you can't see.",r:["awsdocs"],do:"Send EC2 logs to CloudWatch Logs, build a dashboard, create an alarm for high CPU that emails you.",dn:"You caused high CPU on purpose and received the alarm email."},
    {s:3,w:10,t:"PROJECT 5 — your site on AWS",min:150,goal:"Fifth portfolio piece.",r:["progit","awsdocs"],do:"Move Project 4 onto AWS: EC2 for the app, S3 for static assets, CloudWatch alarm, Route 53 for the domain.",dn:"Live on AWS, with a cost estimate in the README."},

    {s:3,w:11,t:"VPC — your own private network",min:120,goal:"Where your subnetting practice pays off.",r:["awsdocs","workshops"],do:"Build a VPC by hand: 2 AZs, public and private subnets, internet gateway, route tables.",dn:"You can draw your VPC from memory."},
    {s:3,w:11,t:"Public vs private, and NAT",min:90,goal:"Keep servers off the public internet without breaking them.",r:["awsdocs"],do:"Put an instance in a private subnet. Give it outbound internet via NAT Gateway. Learn security groups vs NACLs. Warning: NAT Gateway costs money — delete it same day.",dn:"A private instance that can download updates but cannot be reached from outside."},
    {s:3,w:11,t:"Load balancer and auto scaling",min:120,goal:"Handle traffic and failure like a real system.",r:["awsdocs","workshops"],do:"Put an Application Load Balancer in front of an Auto Scaling Group of 2 instances across 2 AZs. Terminate one instance and watch it heal.",dn:"You killed a server and the site stayed up."},
    {s:3,w:11,t:"RDS — managed databases",min:90,goal:"Stop running databases by hand.",r:["awsdocs"],do:"Launch an RDS instance in private subnets, connect from your app instance only, enable automated backups. Read about Multi-AZ.",dn:"Your app talks to RDS and the database is unreachable from the internet."},
    {s:3,w:11,t:"PROJECT 6 — proper 2-tier architecture",min:150,goal:"The classic architecture every AWS interview references.",r:["progit","awsdocs"],do:"ALB → Auto Scaling Group (private subnets) → RDS. Diagram it. Then destroy everything and check your bill.",dn:"A diagram plus a written explanation of every arrow on it."},

    {s:3,w:12,t:"Why write infrastructure as code",min:90,goal:"The shift from clicking to describing.",r:["tf","tfaws"],do:"Install Terraform. Write a config that creates one S3 bucket. Run init, plan, apply, destroy. Read plan output carefully every time.",dn:"You created and destroyed a bucket without touching the console."},
    {s:3,w:12,t:"Variables, outputs and state",min:120,goal:"The concept most beginners get wrong.",r:["tf"],do:"Add variables and outputs. Then move state to an S3 backend. Understand what happens if state is lost.",dn:"You can explain in one sentence what terraform.tfstate is for."},
    {s:3,w:12,t:"Modules and repetition",min:120,goal:"Write once, reuse everywhere.",r:["tf","tfaws"],do:"Turn your VPC config into a module. Use for_each to create multiple subnets instead of copy-paste.",dn:"A module you call twice with different inputs."},
    {s:3,w:12,t:"Safety nets",min:90,goal:"Catch mistakes before they cost money.",r:["tf","ghactions"],do:"Add terraform fmt and validate. Try tflint or checkov. Read a plan that would delete a database and notice it.",dn:"You spotted a destructive change in a plan before applying."},
    {s:3,w:12,t:"PROJECT 7 — rebuild Project 6 in code",min:180,goal:"The single most valuable repo in your portfolio.",r:["progit","tf"],do:"Recreate the entire week 11 architecture in Terraform. Destroy it. Apply it again. Prove it's identical.",dn:"<code>terraform apply</code> builds the whole stack from nothing."},

    {s:4,w:13,t:"What a pipeline is",min:90,goal:"Automate the boring path from code to production.",r:["ghactions"],do:"Create a GitHub Actions workflow that runs on every push and prints hello. Then make it run a linter.",dn:"A green checkmark on your commit."},
    {s:4,w:13,t:"Build and test automatically",min:90,goal:"Catch broken code before it ships.",r:["ghactions"],do:"Add steps: install dependencies, run tests, fail the build on purpose, then fix it.",dn:"A red build you caused, and a green one you fixed."},
    {s:4,w:13,t:"Build and push images from CI",min:120,goal:"No more building images on your laptop.",r:["ghactions","awsdocs"],do:"Workflow builds your Docker image, scans it, tags it with the commit SHA, and pushes to ECR.",dn:"An image in ECR tagged with a real commit hash."},
    {s:4,w:13,t:"Deploy without storing passwords",min:120,goal:"The modern standard — know this name: OIDC.",r:["ghactions","awsdocs"],do:"Set up GitHub Actions to assume an AWS IAM role via OIDC instead of storing access keys. Then deploy your image.",dn:"Zero AWS secrets stored in GitHub, and deploys still work."},
    {s:4,w:13,t:"PROJECT 8 — push to deploy",min:150,goal:"Eighth portfolio piece, and a great interview story.",r:["progit","ghactions"],do:"Change one line of code, push, and watch it reach production automatically. Document each pipeline stage.",dn:"A commit that reached the live site with no manual steps."},

    {s:4,w:14,t:"Why Kubernetes exists",min:90,goal:"Understand the problem before the tool.",r:["k8stut","kind"],do:"Install kind and create a local cluster (free, no AWS bill). Read the Kubernetes basics tutorial.",dn:"<code>kubectl get nodes</code> shows a running node."},
    {s:4,w:14,t:"Pods, deployments, services",min:120,goal:"The three objects that cover 80% of daily work.",r:["k8stut","killercoda"],do:"Deploy your app: a Deployment with 3 replicas and a Service in front. Scale to 5. Delete a pod and watch it come back.",dn:"You deleted a pod and Kubernetes replaced it."},
    {s:4,w:14,t:"Config, secrets and health checks",min:120,goal:"Make deployments behave in the real world.",r:["k8stut","killercoda"],do:"Add a ConfigMap, a Secret, and liveness/readiness probes. Break the probe on purpose and see what happens.",dn:"You can explain the difference between liveness and readiness."},
    {s:4,w:14,t:"Debugging Kubernetes",min:120,goal:"The actual job. This is what you get paid for.",r:["killercoda","k8stut"],do:"Learn kubectl describe, logs, exec, events. Break your deployment 4 ways (bad image, wrong port, missing secret, OOM) and fix each.",dn:"Notes listing each failure, the symptom, and the fix."},
    {s:4,w:14,t:"PROJECT 9 — app on Kubernetes",min:150,goal:"Ninth portfolio piece.",r:["progit","k8stut"],do:"Your containerized app running on kind with configmaps, secrets, probes, and 3 replicas. All YAML in your repo.",dn:"Someone else could run <code>kubectl apply -f .</code> and get your app."},

    // WEEK 15
    {s:4,w:15,t:"What to measure",min:90,goal:"Monitoring that answers questions instead of decorating a screen.",r:["prom","grafana"],do:"Learn the four golden signals: latency, traffic, errors, saturation. Decide which 4 metrics matter for your app.",dn:"A written list of your 4 metrics and why each one matters."},
    {s:4,w:15,t:"Prometheus and Grafana",min:120,goal:"The industry-standard open-source stack.",r:["prom","grafana"],do:"Run Prometheus and Grafana with Docker Compose, scrape your app, build one dashboard with your 4 metrics.",dn:"A dashboard showing real data from your app."},
    {s:4,w:15,t:"Alerts worth waking up for",min:90,goal:"Alert on symptoms, not causes.",r:["prom","grafana"],do:"Create 2 alerts: one on error rate, one on response time. Trigger both deliberately.",dn:"Two alerts that fired for real reasons."},
    {s:4,w:15,t:"Backups, restore and incident writing",min:120,goal:"The skill that separates juniors from people who get trusted.",r:["awsdocs","progit"],do:"Back up your database. Delete data on purpose. Restore it. Time it. Then write a blameless postmortem of the whole thing.",dn:"A written postmortem with timeline, cause, fix, and prevention."},
    {s:4,w:15,t:"PROJECT 10 — you can see and recover",min:150,goal:"Tenth portfolio piece.",r:["progit","grafana"],do:"Dashboard + working alerts + a documented, tested restore procedure with measured recovery time.",dn:"A runbook someone else could follow at 3am."},

    // WEEK 16
    {s:4,w:16,t:"Plan the capstone",min:120,goal:"One project that ties everything together.",r:["roadmapproj","progit"],do:"Design it on paper first: Terraform-built AWS infra, containerized app, CI/CD pipeline, monitoring, backups. Draw the architecture before writing code.",dn:"An architecture diagram and a task list."},
    {s:4,w:16,t:"Build the capstone — part 1",min:180,goal:"Infrastructure and pipeline.",r:["tf","ghactions"],do:"Terraform for all infrastructure, GitHub Actions for deployment via OIDC.",dn:"Infrastructure created from code, deploy pipeline green."},
    {s:4,w:16,t:"Build the capstone — part 2",min:180,goal:"Operations and polish.",r:["grafana","awsdocs"],do:"Add monitoring, alerts, backups, and a cost breakdown. Then destroy and rebuild it once to prove it's reproducible.",dn:"Full rebuild from zero succeeded."},
    {s:4,w:16,t:"Write it up so people understand it",min:120,goal:"Undocumented work doesn't count in a job search.",r:["progit"],do:"README with diagram, decisions and why you made them, cost, and what you'd do differently. Then write one public post about the hardest bug you hit.",dn:"A repo a hiring manager could understand in 3 minutes."},
    {s:4,w:16,t:"Get job-ready",min:150,goal:"Convert 16 weeks into interviews.",r:["saaguide","cantrill","skillbuilder"],do:"Rewrite CV around outcomes, not tools. Link all 10 projects. Practice explaining each one out loud in 2 minutes. Decide whether to book the AWS Solutions Architect Associate exam — check the current exam code on the AWS site first.",dn:"CV sent to at least 5 real job postings."}
  ];

  /* ---------- 3. STATE + STORAGE ---------- */
  var done = {};
  var storageOK = false;
  var KEY = "devops-hub-progress";

  function saveProgress() {
    if (!storageOK) return;
    try { window.storage.set(KEY, JSON.stringify(done)); }
    catch (e) { /* best effort */ }
  }

  function loadProgress(cb) {
    var note = document.getElementById("storage-note");
    if (typeof window.storage === "undefined" || !window.storage) {
      note.innerHTML = "Progress is not saved in this view — tick boxes still work for this session. Print this page to PDF if you want a paper checklist.";
      cb(); return;
    }
    window.storage.get(KEY).then(function (res) {
      storageOK = true;
      if (res && res.value) { try { done = JSON.parse(res.value); } catch (e) { done = {}; } }
      note.innerHTML = 'Progress saves automatically. <button class="reset" id="reset-btn">reset all progress</button>';
      cb();
      var rb = document.getElementById("reset-btn");
      if (rb) rb.onclick = function () {
        if (confirm("Reset all 80 lessons to unchecked?")) { done = {}; saveProgress(); renderAll(); }
      };
    }).catch(function () {
      storageOK = true;
      note.innerHTML = 'Progress saves automatically. <button class="reset" id="reset-btn">reset all progress</button>';
      cb();
      var rb = document.getElementById("reset-btn");
      if (rb) rb.onclick = function () {
        if (confirm("Reset all 80 lessons to unchecked?")) { done = {}; saveProgress(); renderAll(); }
      };
    });
  }

  /* ---------- 4. RENDER HELPERS ---------- */
  function esc(s) { return String(s); }

  function resHTML(keys) {
    return keys.map(function (k) {
      var r = R[k];
      if (!r) return "";
      var tag = r[3] === "paid"
        ? '<span class="paid">paid</span>'
        : '<span class="free">free</span>';
      return '<a class="res" href="' + r[1] + '" target="_blank" rel="noopener">' +
             '<span class="type">' + r[2] + '</span>' + esc(r[0]) + tag +
             '<span class="arrow">↗</span></a>';
    }).join("");
  }

  function firstUndone() {
    for (var i = 0; i < L.length; i++) { if (!done[i]) return i; }
    return -1;
  }

  function renderProgress() {
    var n = 0;
    for (var k in done) { if (done[k]) n++; }
    var pct = Math.round((n / L.length) * 100);
    document.getElementById("prog-fill").style.width = pct + "%";
    document.getElementById("prog-pct").textContent = pct + "%";
    document.getElementById("prog-label").textContent = n + " of " + L.length + " lessons done";
  }

  function renderToday() {
    var i = firstUndone();
    var box = document.getElementById("view-today");
    if (i === -1) {
      box.innerHTML = '<div class="card focus-card"><div class="lesson-title">All 80 lessons complete.</div>' +
        '<p class="goal">Sixteen weeks done. Now go apply for the jobs — the portfolio is the point, not the checkmarks.</p></div>';
      return;
    }
    var l = L[i];
    var st = STAGES[l.s];
    box.innerHTML =
      '<div class="card focus-card">' +
        '<div class="eyebrow">Week ' + l.w + ' · Lesson ' + (i + 1) + ' of ' + L.length + '</div>' +
        '<div class="lesson-title">' + esc(l.t) + '</div>' +
        '<div class="goal">' + esc(l.goal) + '</div>' +
        '<div class="meta">' + esc(st.name) + ' · about ' + l.min + ' minutes</div>' +
        '<div class="label">Materials — click to open</div>' + resHTML(l.r) +
        '<div class="label">Do this</div><div class="do">' + esc(l.do) + '</div>' +
        '<div class="label">You are done when</div><div class="doneif">' + esc(l.dn) + '</div>' +
        '<div class="btn-row">' +
          (i > 0 ? '<button class="btn" id="undo-btn">← Undo last lesson</button>' : '') +
          '<button class="btn primary" id="done-btn">Mark finished ✓</button>' +
        '</div>' +
      '</div>' +
      '<div class="note">Stuck for more than 30 minutes? Note the question, move on, and come back tomorrow. Being stuck is normal; staying stuck is the only mistake.</div>';

    document.getElementById("done-btn").onclick = function () {
      done[i] = true; saveProgress(); renderAll(); window.scrollTo(0, 0);
    };
    var ub = document.getElementById("undo-btn");
    if (ub) ub.onclick = function () { done[i - 1] = false; saveProgress(); renderAll(); window.scrollTo(0, 0); };
  }

  function renderPlan() {
    var cur = firstUndone();
    var curStage = cur === -1 ? STAGES.length - 1 : L[cur].s;
    var html = "";
    STAGES.forEach(function (st, si) {
      var lessons = L.map(function (l, i) { return { l: l, i: i }; }).filter(function (x) { return x.l.s === si; });
      var doneCount = lessons.filter(function (x) { return done[x.i]; }).length;
      html += '<div class="stage' + (si === curStage ? ' open' : '') + '" data-stage="' + si + '">' +
        '<div class="stage-head"><div><div class="stage-name">' + esc(st.name) + '</div>' +
        '<div class="stage-weeks">' + esc(st.weeks) + '</div></div>' +
        '<div class="stage-count">' + doneCount + '/' + lessons.length + '</div></div>' +
        '<div class="stage-body"><div class="note">' + esc(st.note) + '</div>';
      var lastWeek = null;
      lessons.forEach(function (x) {
        if (x.l.w !== lastWeek) { html += '<div class="week-head">Week ' + x.l.w + '</div>'; lastWeek = x.l.w; }
        html += '<div class="row' + (done[x.i] ? ' done' : '') + '" data-i="' + x.i + '">' +
          '<div class="box">✓</div><div><div class="row-title">' + esc(x.l.t) + '</div>' +
          '<div class="row-sub">' + x.l.min + ' min</div></div></div>';
      });
      html += '</div></div>';
    });
    var box = document.getElementById("view-plan");
    box.innerHTML = html;

    box.querySelectorAll(".stage-head").forEach(function (h) {
      h.onclick = function () { h.parentNode.classList.toggle("open"); };
    });
    box.querySelectorAll(".row").forEach(function (row) {
      row.onclick = function () {
        var i = parseInt(row.getAttribute("data-i"), 10);
        done[i] = !done[i]; saveProgress(); renderAll();
      };
    });
  }

  function renderSetup() {
    document.getElementById("view-setup").innerHTML =
      '<div class="card"><h2>Install these once</h2>' +
        resHTML(["wsl", "vscode", "dockerstart", "kind", "tf", "awscli", "shellcheck", "trivy"]) +
      '</div>' +
      '<div class="card warn-box"><h2>Money rules — read before week 9</h2>' +
        '<ul>' +
        '<li><strong>Before creating anything in AWS:</strong> turn on MFA, create a budget alert at €10, €25 and €50.</li>' +
        '<li>Delete everything at the end of each session. <code>terraform destroy</code> or delete in the console.</li>' +
        '<li>The three things that quietly cost money: NAT Gateways, idle load balancers, and EKS clusters. Never leave them overnight.</li>' +
        '<li>Check the billing page every single Sunday. Every one.</li>' +
        '<li>Weeks 1–8 cost almost nothing: a small VPS (~€5/month) and a domain (~€10/year). Everything else in that period is free.</li>' +
        '</ul>' +
      '</div>' +
      '<div class="card"><h2>How to study</h2>' +
        '<ul>' +
        '<li><strong>One lesson per day.</strong> Not two. Consistency beats intensity, and burnout is the main reason people quit at week 6.</li>' +
        '<li><strong>Type every command yourself.</strong> Copy-paste teaches nothing.</li>' +
        '<li><strong>Break things on purpose.</strong> The fix is where the learning is.</li>' +
        '<li><strong>Write notes into your GitHub repo daily.</strong> By week 16 that repo is your CV.</li>' +
        '<li><strong>If you miss a day, just continue.</strong> Don\'t try to catch up — that\'s how people quit.</li>' +
        '</ul>' +
      '</div>' +
      '<div class="card"><h2>Extra practice (optional)</h2>' +
        resHTML(["killercoda", "roadmapproj", "devopscube", "kodekloud", "workshops", "skillbuilder"]) +
      '</div>' +
      '<div class="card"><h2>If you want the certification</h2>' +
        '<p class="goal">Optional. Do it after week 12, once the concepts are real. The exam code changes over time — check AWS\'s own site before paying for any course or booking.</p>' +
        resHTML(["saaguide", "cantrill", "skillbuilder", "awstraining"]) +
      '</div>';
  }

  function renderAll() { renderProgress(); renderToday(); renderPlan(); }

  /* ---------- 5. INIT ---------- */
  document.querySelectorAll(".tab").forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
      t.classList.add("on");
      ["today", "plan", "setup"].forEach(function (v) {
        document.getElementById("view-" + v).style.display = (v === t.getAttribute("data-view")) ? "block" : "none";
      });
      window.scrollTo(0, 0);
    };
  });

  renderSetup();
  loadProgress(renderAll);
})();
</script>
</div>
