<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Cloud Path</title>
<meta name="description" content="A 16-week path from zero to junior DevOps.">

<meta name="theme-color" content="#0a0e0f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cloud Path">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-row">
    <span class="wordmark">Cloud&nbsp;Path</span>
    <span class="streak" id="streak" hidden></span>
  </div>
  <div class="meter" role="progressbar" aria-labelledby="meter-label" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0" id="meter">
    <div class="meter-fill" id="meter-fill"></div>
  </div>
  <div class="meter-label" id="meter-label">&nbsp;</div>
</header>

<main id="main">
  <section id="view-today"  class="view" aria-label="Today's lesson"></section>
  <section id="view-plan"   class="view" hidden aria-label="Full plan"></section>
  <section id="view-setup"  class="view" hidden aria-label="Setup and rules"></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <button class="tab is-active" data-view="today" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
    <span>Today</span>
  </button>
  <button class="tab" data-view="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span>Plan</span>
  </button>
  <button class="tab" data-view="setup">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="8" cy="18" r="2.2"/></svg>
    <span>Setup</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./curriculum.js"></script>
<script src="./store.js"></script>
<script src="./app.js"></script>
</body>
</html>
